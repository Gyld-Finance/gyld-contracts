[profile.default]
src     = "contracts"
out     = "out"
libs    = ["lib"]
solc            = "0.8.28"
via_ir          = true
optimizer       = true
optimizer_runs  = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
# BSC testnet (97) — production guards with a 5-min timelock floor (GLD-807). `--rpc-url bsc_testnet`.
# Public endpoint, no key needed; pass `--rpc-url <url>` directly to use another provider.
bsc_testnet = "https://bsc-testnet-rpc.publicnode.com"
# Katana testnet "Bokuto" (737373) — same production guards and 5-min floor (GLD-850).
katana_testnet = "https://rpc-bokuto.katanarpc.com"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111, url = "https://api-sepolia.etherscan.io/api" }
# BscScan is served by the Etherscan V2 unified API, so the SAME ETHERSCAN_API_KEY covers
# it — there is no separate BSCSCAN_API_KEY. `url` is deliberately omitted: Foundry 1.5.1
# already resolves bsc/bsc-testnet to https://api.etherscan.io/v2/api?chainid=<id>.
# Etherscan removed BNB Chain from free-tier coverage (2025-11-22) for ACCOUNT/tx
# endpoints, but contract source/ABI/verification endpoints stay free on every chain, so
# `forge verify-contract` works on a free key. Use the HYPHENATED table key: `--chain
# bsc_testnet` is rejected by the CLI, `--chain bsc-testnet` is not.
bsc-testnet = { key = "${ETHERSCAN_API_KEY}", chain = 97 }
# Katana testnet "Bokuto" (katanascan) on Etherscan V2, same ETHERSCAN_API_KEY; `url` is
# explicit in case the Foundry release does not know chain 737373.
katana-testnet = { key = "${ETHERSCAN_API_KEY}", chain = 737373, url = "https://api.etherscan.io/v2/api?chainid=737373" }

[fuzz]
runs = 10000

[invariant]
runs           = 1000
depth          = 50
fail_on_revert = true
